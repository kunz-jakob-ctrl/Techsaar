name: Deploy zu Hostinger

# Läuft bei jedem Push nach main (egal ob von Jakob oder Leon) und lädt die
# Website per FTP zu Hostinger hoch. Kann auch manuell ausgelöst werden.
# Die FTP-Zugangsdaten liegen als GitHub-Secrets (Settings -> Secrets and
# variables -> Actions): FTP_HOST, FTP_USERNAME, FTP_PASSWORD.
# NIEMALS die Zugangsdaten hier im Klartext eintragen.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Per FTP zu Hostinger deployen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Ziel auf dem Server. Bei Hostinger liegt die Website i. d. R. in
          # public_html/. Falls euer FTP-Konto schon DIREKT in public_html
          # startet, hier auf "./" ändern.
          server-dir: public_html/
          local-dir: ./
          # Nur geänderte Dateien werden übertragen (Zustand wird serverseitig
          # in .ftp-deploy-sync-state.json gemerkt).
          exclude: |
            # --- Sensible / interne Daten: NIE öffentlich ---
            **/*.xlsx
            **/*.docx
            legal-data.json
            # --- Entwurfs-/Review-Seiten (nicht für die Live-Domain) ---
            **/*.preview.html
            # --- Interne Sales-Demo (auskommentieren, um sie doch zu deployen) ---
            telefon-demo/**
            # --- Entwickler-/Build-Kram (auf dem Server unnötig) ---
            **/.git*
            **/.git*/**
            .github/**
            build/**
            tailwind.config.js
            README.md
            **/*.md
