name: Deploy zu Hostinger

# Läuft bei jedem Push nach main (egal ob von Jakob oder Leon) und lädt die
# Website per FTP zu Hostinger hoch. Kann auch manuell ausgelöst werden.
# Die FTP-Zugangsdaten liegen als GitHub-Secrets (Settings -> Secrets and
# variables -> Actions): FTP_HOST, FTP_USERNAME, FTP_PASSWORD.
# NIEMALS die Zugangsdaten hier im Klartext eintragen.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Per FTP zu Hostinger deployen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Verschluesseltes FTPS (explicit AUTH TLS ueber Port 21).
          # WICHTIG: Das Secret FTP_HOST muss der Hostname sein, fuer den das
          # Server-Zertifikat gilt (aus hPanel -> FTP-Konten), NICHT die IP --
          # sonst schlaegt die Zertifikatspruefung fehl.
          protocol: ftps
          port: 21
          # Web-Root dieses Kontos ist domains/tech-saar.de/public_html/ (das
          # FTP-Konto startet im Account-Root, nicht direkt in public_html/).
          # Mit "public_html/" schlaegt der CWD fehl (550 denied).
          server-dir: domains/tech-saar.de/public_html/
          local-dir: ./
          # Nur geänderte Dateien werden übertragen (Zustand wird serverseitig
          # in .ftp-deploy-sync-state.json gemerkt).
          exclude: |
            # --- Sensible / interne Daten: NIE öffentlich ---
            **/*.xlsx
            **/*.docx
            legal-data.json
            # --- Entwurfs-/Review-Seiten (nicht für die Live-Domain) ---
            **/*.preview.html
            # --- Interne Sales-Demo (auskommentieren, um sie doch zu deployen) ---
            telefon-demo/**
            # --- Entwickler-/Build-Kram (auf dem Server unnötig) ---
            **/.git*
            **/.git*/**
            .github/**
            build/**
            tailwind.config.js
            README.md
            **/*.md
