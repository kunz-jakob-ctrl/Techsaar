# Serverkonfiguration fuer die Kundendomain eckstueck-stwendel.de
#
# Diese Datei heisst bewusst NICHT .htaccess: sonst wuerde sie im Ordner
# eckstueck-demo/ liegen und dort wirken, wo sie nicht hingehoert. Der
# Deploy-Ablauf kopiert sie beim Ausliefern nach .htaccess um
# (.github/workflows/deploy.yml, Schritt "Eckstueck-Verzeichnis vorbereiten").

RewriteEngine On

# HTTPS erzwingen und www auf die Hauptdomain umleiten (301)
RewriteCond %{HTTPS} !=on [OR]
RewriteCond %{HTTP_HOST} ^www\. [NC]
RewriteRule ^ https://eckstueck-stwendel.de%{REQUEST_URI} [R=301,L]

# Caching wie auf tech-saar.de: HTML jedes Mal kurz rueckfragen lassen,
# Medien und Schriften lange liegen lassen. Die Fotos tragen eine
# Versionskennung in der URL (?v=JJJJ-MM-TT), damit ein Bildertausch trotz
# der langen Haltbarkeit sofort bei allen ankommt.
# Die IfModule-Klammer verhindert einen 500er, falls mod_headers fehlt.
<IfModule mod_headers.c>
  <FilesMatch "\.html$">
    Header set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>
  <FilesMatch "\.(jpg|jpeg|png|webp|svg|ico|woff2|woff|css|js)$">
    Header set Cache-Control "public, max-age=31536000"
  </FilesMatch>
</IfModule>
