<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechSaar — Unsere Web-Demos</title>
  <meta name="description" content="Übersicht unserer Demo-Websites: Barbershop, Döner, Eisdiele & mehr — individuell gestaltet aus dem Saarland." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { theme: { extend: {
      colors: { paper:'#FBFAF8', ink:'#1A1A22', muted:'#6B6B76', line:'#E7E3DC', lilac:'#8B7CF6' },
      fontFamily: { display:['"Space Grotesk"','sans-serif'], sans:['Inter','system-ui','sans-serif'] }
    }}}
  </script>
  <style>
    html,body{background:#FBFAF8}
    .reveal{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
    .reveal.in{opacity:1;transform:none}
    .grad-text{background:linear-gradient(100deg,#8B7CF6,#FB8C8C,#FFB178);-webkit-background-clip:text;background-clip:text;color:transparent}
    .card{transition:transform .25s cubic-bezier(.2,.7,.2,1),box-shadow .25s}
    .card:hover{transform:translateY(-6px);box-shadow:0 24px 50px -24px rgba(40,30,20,.35)}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.001ms!important}.reveal{opacity:1;transform:none}}
  </style>
</head>
<body class="bg-paper font-sans text-ink antialiased">

  <header class="mx-auto max-w-6xl px-5 pt-16 pb-10 text-center sm:px-6 sm:pt-24">
    <div class="reveal mx-auto mb-6 inline-flex items-center gap-2 rounded-full border border-line bg-white px-4 py-1.5 text-sm font-medium shadow-sm">
      <span class="grid h-6 w-6 place-items-center rounded-lg bg-ink text-paper"><svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 9-3 3 3 3"/><path d="m16 9 3 3-3 3"/></svg></span>
      TechSaar · Web-Demos
    </div>
    <h1 class="reveal font-display text-5xl font-bold leading-[1.05] tracking-tight sm:text-6xl">Websites, die <span class="grad-text">auffallen</span>.</h1>
    <p class="reveal mx-auto mt-5 max-w-xl text-lg text-muted">Eine Auswahl unserer Demo-Seiten für lokale Betriebe. Jede ist individuell gestaltet — modern, schnell, mobiloptimiert. Klick dich durch.</p>
  </header>

  <main class="mx-auto max-w-6xl px-5 pb-24 sm:px-6">
    <div id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div>
    <p class="reveal mt-14 text-center text-sm text-muted">Gebaut von <strong class="text-ink">TechSaar</strong> · Saarland · <span id="year"></span></p>
  </main>

  <script>
    const DEMOS = [
      { name:'Saar Barber Co.', tag:'Barbershop · Friseur', url:'saar-barber-demo/',
        desc:'Dunkel & Gold, Vintage-Look, Online-Terminbuchung mit Friseur-Verfügbarkeit.',
        bg:'linear-gradient(135deg,#1C1917,#3a2e10 70%)', accent:'#E7C66B', label:'DEIN LOOK.' },
      { name:'Gelateria Luna', tag:'Eisdiele', url:'gelateria-demo/',
        desc:'Premium Gelateria, Serifenschrift, runde Eiskugel-Motive, Google-Maps.',
        bg:'linear-gradient(135deg,#DB6188,#9CC078)', accent:'#fff', label:'mit Liebe gerührt' },
      { name:'TechSaar', tag:'Unsere Agentur-Seite', url:'techsaar/',
        desc:'Hell & modern, Cursor-Spotlight, Leistungen, Arbeiten & Kontakt.',
        bg:'linear-gradient(135deg,#8B7CF6,#FB8C8C 60%,#FFB178)', accent:'#fff', label:'Auffallen. Lokal. Digital.' },
    ];

    document.getElementById('grid').innerHTML = DEMOS.map((d,i)=>`
      <a href="${d.url}" class="card reveal group block overflow-hidden rounded-3xl border border-line bg-white" style="transition-delay:${i*60}ms">
        <div class="relative flex h-44 items-end p-5" style="background:${d.bg}">
          <span class="font-display text-xl font-bold tracking-tight" style="color:${d.accent}">${d.label}</span>
          <span class="absolute right-4 top-4 rounded-full bg-white/15 px-2.5 py-1 text-[11px] font-semibold text-white backdrop-blur">${d.tag}</span>
        </div>
        <div class="p-6">
          <div class="flex items-center justify-between gap-3">
            <h2 class="font-display text-xl font-bold">${d.name}</h2>
            <span class="grid h-9 w-9 place-items-center rounded-full bg-paper text-ink transition-colors group-hover:bg-ink group-hover:text-paper">
              <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>
            </span>
          </div>
          <p class="mt-2 text-sm text-muted">${d.desc}</p>
        </div>
      </a>`).join('');

    document.getElementById('year').textContent = new Date().getFullYear();
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  </script>
</body>
</html>
