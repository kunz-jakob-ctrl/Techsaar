# Netlify-Konfiguration für die SBS-Bau-Demo
# Statische Seite ohne Build-Schritt: Netlify lädt den Ordner einfach hoch.
# Bewusst KEIN [build]-Abschnitt — sonst versucht Netlify einen Build zu starten.

# Demo-Seite: soll nicht in Suchmaschinen landen.
# Ergänzt das <meta name="robots" content="noindex"> in jeder Datei.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Die Seite lädt nichts von Dritten - das schreiben wir hier auch fest.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"

# Schriften und Bilder ändern sich nicht mehr - lange zwischenspeichern.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
